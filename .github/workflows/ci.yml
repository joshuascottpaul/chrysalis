name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @('src', 'tests')
          $settingsPath = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $results = @()
          foreach ($t in $targets) {
            if (Test-Path -LiteralPath $t) {
              $results += Invoke-ScriptAnalyzer -Path $t -Recurse -Settings $settingsPath
            }
          }
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error "PSScriptAnalyzer reported $($results.Count) finding(s)."
            exit 1
          }
          Write-Host "PSScriptAnalyzer: clean."

  test:
    name: Pester
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          Get-Module Pester | Format-Table Name, Version

      - name: Run Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'test-results/pester.xml'
          $config.Output.Verbosity = 'Detailed'
          if (-not (Test-Path -LiteralPath 'test-results')) {
            New-Item -ItemType Directory -Path 'test-results' | Out-Null
          }
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: test-results/pester.xml
          if-no-files-found: warn
